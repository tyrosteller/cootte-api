[project]
name = "cootte-api"
version = "0.1.0"
description = ""
authors = [
    {name = "tyrosteller",email = "tyros.dev@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.115.7,<0.116.0)",
    "uvicorn[standard] (>=0.34.0,<0.35.0)",
    "pydantic-settings (>=2.7.1,<3.0.0)",
    "sqlalchemy (>=2.0.38,<3.0.0)",
    "psycopg2 (>=2.9.10,<3.0.0)",
    "bcrypt (>=4.2.1,<5.0.0)"
]

[tool.poetry]
package-mode = false


[tool.ruff]
line-length = 100  # black과 동일한 코드 길이 설정

# Black, isort 기능 활성화
[tool.ruff.format]
quote-style = "double"  # 따옴표 스타일 설정 ("double" = " -> ")
indent-style = "space"  # 들여쓰기 스타일 (space 사용)

[tool.ruff.lint]
select = ["E", "F", "I", "B"]  # 기본 린트 규칙 (E: pycodestyle, F: pyflakes, I: isort, B: flake8-bugbear)
ignore = ["E501"]  # 길이 제한 무시
fixable = ["F", "I", "B"]  # 자동 수정 가능한 항목

[tool.mypy]
explicit_package_bases = true
packages = ["app"]
ignore_missing_imports = true  # 외부 라이브러리 타입 힌트 오류 무시
disallow_untyped_defs = true  # 타입 힌트 없는 함수 경고
check_untyped_defs = true  # 타입 힌트 없는 함수도 검사
warn_unused_ignores = true  # 불필요한 # type: ignore 경고
warn_return_any = true  # 반환 타입이 Any이면 경고
warn_unreachable = true  # 도달할 수 없는 코드 경고
strict = true  # 엄격한 검사


[tool.poetry.group.dev.dependencies]
ruff = "^0.9.3"
mypy = "^1.14.1"
pre-commit = "^4.1.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"